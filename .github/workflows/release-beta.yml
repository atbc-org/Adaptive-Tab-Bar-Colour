name: Release Beta

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Prepare Version
        id: version
        run: bash scripts/release.sh prepare_beta_version
      - name: Build And Upload To AMO (Beta)
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          BETA_VERSION: ${{ steps.version.outputs.beta_version }}
        run: bash scripts/release.sh build_and_sign_beta "$BETA_VERSION"
      - name: Tag And Create GitHub Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETA_TAG: ${{ steps.version.outputs.beta_tag }}
          BETA_VERSION: ${{ steps.version.outputs.beta_version }}
        run:
          bash scripts/release.sh create_beta_release "$BETA_TAG"
          "$BETA_VERSION"
