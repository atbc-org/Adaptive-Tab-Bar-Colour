name: Release Production

concurrency:
  group: amo-api

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes for the release
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    environment:
      name: AMO
      url: https://addons.mozilla.org/firefox/addon/adaptive-tab-bar-colour/
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci --silent
      - name: Build And Upload To AMO (Production)
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          RELEASE_NOTES:
            ${{ github.event.pull_request.body || inputs.notes || '' }}
        run: bash scripts/release.sh build_and_sign_production "$RELEASE_NOTES"
      - name: Tag And Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES:
            ${{ github.event.pull_request.body || inputs.notes || '' }}
        run: bash scripts/release.sh create_production_release "$RELEASE_NOTES"
